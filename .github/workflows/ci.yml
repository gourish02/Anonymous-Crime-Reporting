name: CI/CD Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  # ── Job 1: Frontend & Midnight DApp (Build, Type-Check, Lint & Tests) ───────
  frontend-ci:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: TypeScript strict compiler check
        run: npm run type-check

      - name: Code quality lint check
        run: npm run lint || echo "Lint warnings permitted in CI"

      - name: Execute Midnight DApp test suite
        run: npm test

      - name: Build production bundle
        run: npm run build
        env:
          VITE_MIDNIGHT_NETWORK: preprod
          VITE_CONTRACT_ADDRESS_PREPROD: ${{ secrets.CONTRACT_ADDRESS_PREPROD }}
          VITE_CONTRACT_ADDRESS_DEVNET: ${{ secrets.CONTRACT_ADDRESS_DEVNET }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ── Job 2: Midnight Compact Smart Contract (Circuits & Tests) ───────────────
  contract-ci:
    name: Compact Contract & Circuit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Compact contract exists and is non-empty
        run: |
          test -s contract/src/crime_report.compact && \
          echo "✅ Compact contract file verified" || \
          (echo "❌ Compact contract file missing or empty" && exit 1)

      - name: Validate Compact circuits & ledger syntax
        run: |
          grep -qE "export circuit (submit_report|submitCrimeReport)" contract/src/crime_report.compact && \
          grep -q "export circuit submitVolunteerCredential" contract/src/crime_report.compact && \
          grep -q "export circuit verifyVolunteerCredential" contract/src/crime_report.compact && \
          grep -q "export ledger" contract/src/crime_report.compact && \
          echo "✅ All required Module 1 & Module 2 circuits present"

      - name: Execute Midnight Compact contract test suite
        run: node contract/test/crime_report.contract-test.mjs

  # ── Job 3: Python AI Crime Classifier & FastAPI Service ─────────────────────
  ai-backend-ci:
    name: AI Classifier & Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Scikit-Learn training pipeline
        run: python backend/train.py

      - name: Execute ML classifier unit tests
        run: python backend/test_classifier.py

      - name: Execute FastAPI integration tests
        run: python backend/test_api.py
