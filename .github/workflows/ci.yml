name: CI — Build, Lint & Type-check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: TypeScript type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint || echo "Lint warnings allowed in CI"

      - name: Run Midnight Test Suite
        run: npm test

      - name: Build production bundle
        run: npm run build
        env:
          VITE_MIDNIGHT_NETWORK: preprod
          VITE_CONTRACT_ADDRESS_PREPROD: ${{ secrets.CONTRACT_ADDRESS_PREPROD }}
          VITE_CONTRACT_ADDRESS_DEVNET: ${{ secrets.CONTRACT_ADDRESS_DEVNET }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ── Compact contract lint & tests ─────────────────────────────────────────
  contract-check:
    name: Compact Contract Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify contract file exists and is non-empty
        run: |
          test -s contract/src/crime_report.compact && \
          echo "✅ Contract file present and non-empty" || \
          (echo "❌ Contract file missing or empty" && exit 1)

      - name: Check contract syntax (basic)
        run: |
          grep -qE "export circuit (submit_report|submitCrimeReport)" contract/src/crime_report.compact && \
          grep -q "export ledger"                                      contract/src/crime_report.compact && \
          echo "✅ Required contract circuits present"

      - name: Run Midnight Compact Contract Test Suite
        run: node contract/test/crime_report.test.mjs

  # ── Python AI Crime Classifier Check ───────────────────────────────────────
  ai-backend-check:
    name: AI Classifier & FastAPI Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run training pipeline
        run: |
          python backend/train.py

      - name: Run ML classifier unit tests
        run: |
          python backend/test_classifier.py

      - name: Run FastAPI integration tests
        run: |
          python backend/test_api.py
